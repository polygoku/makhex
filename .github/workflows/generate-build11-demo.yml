name: Generate self-hosted Build 11 demo assets
on:
  push:
    branches: [codex/build11-source-media-bom-20261023]
    paths:
      - 'scripts/render-build11-video.py'
      - '.github/workflows/generate-build11-demo.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Render independent video without creator's original footage
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python scripts/render-build11-video.py
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/demo/build11-en-concept.mp4
      - name: Commit compiled demo and stills
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/demo/
          if ! git diff --cached --quiet; then
            git commit -m 'Build first-party English workflow demo MP4 and annotated stills'
            git push origin HEAD:refs/heads/codex/build11-source-media-bom-20261023
          fi
