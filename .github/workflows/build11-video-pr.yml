name: Build 11 independent video assets in PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  stage-video:
    if: ${{ github.repository == 'polygoku/makhex' && github.head_ref == 'codex/build11-source-media-bom-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build11-source-media-bom-20261023
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Render direct-play first-party video and screenshots
        run: |
          command -v ffmpeg
          python scripts/render-build11-video.py
          ffprobe -v error -show_entries format=size,duration -of default=noprint_wrappers=1 public/demo/build11-en-concept.mp4
      - name: Commit static media to current PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/demo/
          if ! git diff --cached --quiet; then
            git commit -m 'Stage original Build 11 video, stills and captions'
            git push origin HEAD:refs/heads/codex/build11-source-media-bom-20261023
          fi
