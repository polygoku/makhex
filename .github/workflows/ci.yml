name: MAKHEX CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:launch
      - run: npm run test:cutover
      - run: npm run check
      - run: npm run build
      - run: npm run qa
      - run: npx wrangler deploy --dry-run
