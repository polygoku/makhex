name: MAKHEX CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:launch
      - run: npm run test:cutover
      - run: npm run check
      - run: npm run build
      - run: npm run qa
      - run: npx wrangler deploy --dry-run
      - name: Headless Chrome parts-cart behavior test
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4399 > /tmp/makhex-browser-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4399/ > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:4399/ > /dev/null; then
            echo 'Astro preview did not start:'
            cat /tmp/makhex-browser-preview.log
            exit 1
          fi
          node scripts/cart-browser.test.mjs
