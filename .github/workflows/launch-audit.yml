name: MAKHEX production launch audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
      MAKHEX_PERMANENT_WORKER_URL: ${{ vars.MAKHEX_PERMANENT_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:launch
      - name: Read-only launch gate
        id: readiness
        continue-on-error: true
        run: npm run launch:audit -- --output reports/sprint05-launch-audit.json
      - name: Attach audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makhex-launch-readiness
          path: reports/sprint05-launch-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show release status
        if: always()
        run: |
          echo "Launch audit completed. Read the makhex-launch-readiness artifact for the detailed GO/NO-GO result." >> "$GITHUB_STEP_SUMMARY"
          echo "No DNS changes, website publication, purchases, or Cloudflare writes occur in this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce NO-GO status
        if: always() && steps.readiness.outcome == 'failure'
        run: |
          echo "Production launch remains blocked. This failing status is intentional until every gate passes."
          exit 1
