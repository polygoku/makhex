name: MAKHEX Cloudflare deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: makhex-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_SQUARESPACE_SHOP_URL: ${{ vars.PUBLIC_SQUARESPACE_SHOP_URL }}
      PUBLIC_SQUARESPACE_ALLOWED_HOSTS: ${{ vars.PUBLIC_SQUARESPACE_ALLOWED_HOSTS }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run qa
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy
      - name: Verify public website, when provisioned
        if: ${{ vars.PUBLIC_SMOKE_URL != '' }}
        env:
          SMOKE_URL: ${{ vars.PUBLIC_SMOKE_URL }}
        run: npm run smoke:public -- "$SMOKE_URL"
